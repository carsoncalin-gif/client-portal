<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b2426">
<title>Texting Carson</title>
<!--
  Apple Mail refuses sms: links, on iPhone and on Mac, but it opens https:
  links fine. Safari honours sms: perfectly, which is why texting works from
  the portal itself. So the Text Carson button in the email points here, and
  this page hands straight off to Messages.

  If that handoff does not fire for any reason, everything below is still a
  working way to reach Carson, so this page can never be a dead end.
-->
<style>
  :root{
    --ink:#1b2426; --ink-soft:#4a5a5d; --paper:#f5f1ea; --card:#ffffff;
    --teal:#0e9fb0; --teal-deep:#0a7a87; --teal-wash:#e2f2f4; --line:#e6ded2;
    --shadow:0 18px 50px -22px rgba(20,40,42,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%, rgba(14,159,176,.10), transparent 60%), var(--paper);
    color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px;
    max-width:400px;width:100%;box-shadow:var(--shadow);text-align:center}
  .mark{width:46px;height:46px;border-radius:13px;background:var(--teal);margin:0 auto 18px;display:grid;
    place-items:center;color:#04282c;font-family:Georgia,serif;font-weight:700;font-size:23px;
    box-shadow:0 8px 20px -8px rgba(14,159,176,.7)}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:22px;margin-bottom:8px}
  p{color:var(--ink-soft);font-size:14.5px;line-height:1.55;margin-bottom:22px}
  a.btn{display:block;text-decoration:none;font-weight:700;font-size:16px;padding:16px;border-radius:12px;
    margin-bottom:11px;transition:.18s}
  a.primary{background:var(--ink);color:#fff}
  a.primary:hover{background:var(--teal-deep)}
  a.ghost{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
  a.ghost:hover{background:var(--paper)}
  .num{font-size:15px;color:var(--ink);margin-top:16px}
  .num b{font-weight:700}
  .foot{margin-top:20px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);opacity:.7}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">C</div>
    <h1>Opening Messages</h1>
    <p id="note">Your phone should be opening a text to Carson now. If it does not, use a button below.</p>
    <a class="btn primary" id="textBtn" href="sms:3179035973">Text Carson</a>
    <a class="btn ghost" href="tel:+13179035973">Call Carson</a>
    <div class="num">Or reach him at <b>(317) 903-5973</b></div>
    <div class="foot">Carson Calin, REALTOR&reg; &middot; Brokered by eXp Realty</div>
  </div>
<script>
  /* Hand off immediately. Kept out of a click handler so it fires on arrival. */
  var NUMBER = "3179035973";
  try { window.location.replace("sms:" + NUMBER); } catch (e) {}
  /* If we are still here a moment later, the handoff did not take, so stop
     promising it and let the buttons do the work. */
  setTimeout(function(){
    var n = document.getElementById("note");
    if (n) n.textContent = "Tap below to text or call Carson.";
    document.querySelector("h1").textContent = "Reach Carson";
  }, 2500);
</script>
</body>
</html>
